name: CI - Test, Scan, Publish and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: b9is121-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
  SERVICE: b9is121-cloudops-api
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SA }}

jobs:
  validate-build-scan:
    name: Validate, test, build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Static analysis with Ruff
        run: ruff check app tests

      - name: Security-focused Python source scan
        run: bandit -q -r app -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Run automated tests
        run: pytest -q --junitxml=test-results.xml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
        env:
          TF_IN_AUTOMATION: "true"

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
        env:
          TF_IN_AUTOMATION: "true"

      - name: Build the container image
        run: docker build --pull -t "b9is121-cloudops-api:${GITHUB_SHA}" .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # pinned full commit SHA
        with:
          scan-type: image
          image-ref: b9is121-cloudops-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Prepare immutable image artifact
        id: image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_AR_REPOSITORY != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_RUNTIME_SA != ''
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/b9is121-cloudops-api:${GITHUB_SHA}"
          docker tag "b9is121-cloudops-api:${GITHUB_SHA}" "${IMAGE}"
          docker save "${IMAGE}" --output image.tar
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_AR_REPOSITORY != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_RUNTIME_SA != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-container-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Explain cloud deployment status
        if: github.event_name != 'pull_request' && (vars.GCP_PROJECT_ID == '' || vars.GCP_REGION == '' || vars.GCP_AR_REPOSITORY == '' || vars.GCP_WIF_PROVIDER == '' || vars.GCP_DEPLOY_SA == '' || vars.GCP_RUNTIME_SA == '')
        run: |
          {
            echo "## Cloud deployment not configured"
            echo "Validation, tests, Docker build, Terraform validation and image scanning ran."
            echo "Cloud deployment is skipped until the six Google Cloud repository variables are configured."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-test-results-${{ github.sha }}
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publish image and deploy to Cloud Run
    needs: validate-build-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_AR_REPOSITORY != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_RUNTIME_SA != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact image that passed scanning
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-container-image-${{ github.sha }}
          path: .

      - name: Load verified image
        run: docker load --input image.tar

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Publish immutable image to Artifact Registry
        run: docker push "${{ needs.validate-build-scan.outputs.image }}"

      - name: Deploy the new image revision
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --image "${{ needs.validate-build-scan.outputs.image }}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 80 \
            --max 3 \
            --min 0 \
            --set-env-vars "APP_ENV=production,BUILD_SHA=${GITHUB_SHA}" \
            --quiet

      - name: Verify the deployed revision
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --format='value(status.url)')"
          test -n "${SERVICE_URL}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors \
            "${SERVICE_URL}/healthz"
          INFO="$(curl --fail --silent --show-error "${SERVICE_URL}/api/v1/info")"
          printf '%s' "${INFO}" | python -c \
            "import json,sys; assert json.load(sys.stdin)['build_sha'] == '${GITHUB_SHA}'"
          {
            echo "### Deployment verification"
            echo "- Service URL: ${SERVICE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Health check: HTTP request successful"
            echo "- Build identity: verified against deployed API metadata"
          } >> "${GITHUB_STEP_SUMMARY}"
