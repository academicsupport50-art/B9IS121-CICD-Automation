name: CI - Test, Scan, Publish and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b9is121-cloud-run-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
  SERVICE: b9is121-cloudops-api
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SA }}

jobs:
  validate-build-scan:
    name: Lint, security checks, tests and container scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint Python source
        run: ruff check app tests

      - name: Run Bandit static security checks
        run: bandit -q -r app -ll

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

      - name: Run automated tests
        run: pytest -q --junitxml=test-results.xml

      - name: Build container image
        run: docker build --pull -t "b9is121-cloudops-api:${GITHUB_SHA}" .

      - name: Scan the exact image that will be deployed
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # verified Trivy action commit
        with:
          scan-type: image
          image-ref: b9is121-cloudops-api:${{ github.sha }}
          format: table
          output: trivy-results.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Preserve test and vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validation-reports-${{ github.sha }}
          path: |
            test-results.xml
            trivy-results.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare immutable image for deployment
        id: image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/b9is121-cloudops-api:${GITHUB_SHA}"
          docker tag "b9is121-cloudops-api:${GITHUB_SHA}" "${IMAGE}"
          docker save "${IMAGE}" --output image.tar
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Upload the exact scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-container-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Publish scanned image and deploy to Cloud Run
    needs: validate-build-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact image that passed validation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-container-image-${{ github.sha }}
          path: .

      - name: Load scanned container image
        run: docker load --input image.tar

      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Publish the scanned image
        run: docker push "${{ needs.validate-build-scan.outputs.image }}"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${SERVICE}" \
            --image "${{ needs.validate-build-scan.outputs.image }}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --port 8080 --memory 512Mi --cpu 1 \
            --concurrency 80 --max 3 --min 0 \
            --set-env-vars "APP_ENV=production,BUILD_SHA=${GITHUB_SHA}" \
            --quiet

      - name: Verify live service and deployed commit identity
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "${SERVICE}" --region "${REGION}" --project "${PROJECT_ID}" --format='value(status.url)')"
          test -n "${URL}"
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-all-errors "${URL}/healthz"
          curl --fail --silent --show-error "${URL}/api/v1/info" | python -c "import json,sys; assert json.load(sys.stdin)['build_sha']=='${GITHUB_SHA}'"
          {
            echo "## Cloud Run deployment verified"
            echo "- Service URL: ${URL}"
            echo "- Health endpoint: ${URL}/healthz"
            echo "- Deployed source commit: ${GITHUB_SHA}"
            echo "- Image: ${{ needs.validate-build-scan.outputs.image }}"
          } >> "${GITHUB_STEP_SUMMARY}"
