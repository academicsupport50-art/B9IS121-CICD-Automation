name: CI - Test, Scan, Publish and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: b9is121-ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
  SERVICE: b9is121-cloudops-api
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SA }}

jobs:
  validate-build-scan:
    name: Validate, test, build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static analysis with Ruff
        run: ruff check app tests

      - name: Security-focused Python source scan
        run: bandit -q -r app -ll

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Run automated tests
        run: pytest -q --junitxml=test-results.xml

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
        env:
          TF_IN_AUTOMATION: "true"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform configuration
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
        env:
          TF_IN_AUTOMATION: "true"

      - name: Build the container image
        run: docker build --pull -t b9is121-cloudops-api:${GITHUB_SHA} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: image
          image-ref: b9is121-cloudops-api:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Prepare immutable image artifact
        id: image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_AR_REPOSITORY != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_RUNTIME_SA != ''
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/b9is121-cloudops-api:${GITHUB_SHA}"
          docker tag "b9is121-cloudops-api:${GITHUB_SHA}" "${IMAGE}"
          docker save "${IMAGE}" -o image.tar
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Upload verified container image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_AR_REPOSITORY != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_RUNTIME_SA != ''
        uses: actions/upload-artifact@v4
        with:
          name: verified-container-image
          path: image.tar
          retention-days: 1

      - name: Explain cloud deployment status
        if: github.event_name != 'pull_request' && (vars.GCP_PROJECT_ID == '' || vars.GCP_REGION == '' || vars.GCP_AR_REPOSITORY == '' || vars.GCP_WIF_PROVIDER == '' || vars.GCP_DEPLOY_SA == '' || vars.GCP_RUNTIME_SA == '')
        run: |
          echo "## Cloud deployment not configured" >> "$GITHUB_STEP_SUMMARY"
          echo "Validation, tests, Docker build and image scan ran. Deployment is skipped until all six Google Cloud repository variables are configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Publish image and deploy to Cloud Run
    needs: validate-build-scan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != '' && vars.GCP_REGION != '' && vars.GCP_AR_REPOSITORY != '' && vars.GCP_WIF_PROVIDER != '' && vars.GCP_DEPLOY_SA != '' && vars.GCP_RUNTIME_SA != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact image that passed scanning
        uses: actions/download-artifact@v4
        with:
          name: verified-container-image

      - name: Load verified image
        run: docker load -i image.tar

      - name: Authenticate to Google Cloud using GitHub OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Publish immutable image to Artifact Registry
        run: docker push "${{ needs.validate-build-scan.outputs.image }}"

      - name: Deploy the new image revision
        run: |
          gcloud run deploy "${SERVICE}" \
            --image "${{ needs.validate-build-scan.outputs.image }}" \
            --region "${REGION}" \
            --project "${PROJECT_ID}" \
            --platform managed \
            --service-account "${RUNTIME_SERVICE_ACCOUNT}" \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --concurrency 80 \
            --max 3 \
            --min 0 \
            --set-env-vars "APP_ENV=production,BUILD_SHA=${GITHUB_SHA}" \
            --quiet

      - name: Verify the deployed revision
        run: |
          SERVICE_URL="$(gcloud run services describe "${SERVICE}" \
            --region "${REGION}" --project "${PROJECT_ID}" \
            --format='value(status.url)')"
          test -n "${SERVICE_URL}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "${SERVICE_URL}/healthz"
          INFO="$(curl --fail --silent --show-error "${SERVICE_URL}/api/v1/info")"
          printf '%s' "${INFO}" | python -c \
            "import json,sys; assert json.load(sys.stdin)['build_sha'] == '${GITHUB_SHA}'"
          {
            echo "### Deployment verification"
            echo "- Service URL: ${SERVICE_URL}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Health check: HTTP request successful"
            echo "- Build identity: verified against deployed API metadata"
          } >> "$GITHUB_STEP_SUMMARY"
